spring.config.import=optional:file:./.env[.properties]

spring.application.name=agroflow-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agroflow_db}
spring.datasource.username=${DB_USERNAME:agroflow_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

spring.security.user.name=${APP_ADMIN_USERNAME:admin}
spring.security.user.password=${APP_ADMIN_PASSWORD:change_me}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

