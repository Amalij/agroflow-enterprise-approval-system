<h2 mat-dialog-title>Cancel request?</h2>
<mat-dialog-content>
  <p>Cancel <strong>{{ data.requestId }}</strong>, “{{ data.title }}”?</p>
  <p class="dialog-note">The request will remain in your history with Cancelled status.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Keep request</button>
  <button mat-flat-button color="warn" type="button" (click)="confirm()">Cancel Request</button>
</mat-dialog-actions>
